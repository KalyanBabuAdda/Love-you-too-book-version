<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0807" />
  <title>Sriram & Vasanthi — Our Memories</title>
  <link rel="preload" href="assets/memory-book.png" as="image" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scroll-space" aria-label="Sriram and Vasanthi memory book">
    <section class="stage" id="stage">
      <div class="ambient" aria-hidden="true">
        <span class="glow glow-a"></span>
        <span class="glow glow-b"></span>
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
      </div>

      <div class="camera" id="camera">
        <div class="scene" id="scene">
          <img
            id="sceneImage"
            class="scene-image"
            src="assets/memory-book.png"
            alt="A cinematic memory book for Sriram and Vasanthi"
            draggable="false"
          />
          <div class="page-light" id="pageLight" aria-hidden="true"></div>
          <div class="glass-light" id="glassLight" aria-hidden="true"></div>
        </div>
      </div>

      <div class="vignette" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="scroll-cue" id="scrollCue" aria-hidden="true">
        <span>SCROLL</span><i></i>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
